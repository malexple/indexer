services:
  mcp-sql:
    image: malexple/mcp-sql:${MCPSQL_TAG:-0.1.0}
    restart: unless-stopped
    env_file: .env
    volumes:
      - mcp-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MCPSQL_DOMAIN=${MCPSQL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp-sql

volumes:
  mcp-data:
  caddy-data:
  caddy-config: