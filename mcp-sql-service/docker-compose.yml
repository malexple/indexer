services:
  mcp-sql:
    image: malexple/mcp-sql:${MCPSQL_TAG:-0.1.0}
    restart: unless-stopped
    env_file: .env
    volumes:
      - mcp-data:/data
    expose:
      - "8080"

  mcp-sql-bot:
    image: malexple/mcp-sql-bot:${MCPSQL_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_SERVICE_URL: http://mcp-sql:8080
      BOT_INTERNAL_KEY: ${MCPSQL_INTERNAL_KEY:-}
      BOT_PUBLIC_URL: ${BOT_PUBLIC_URL:-}
    depends_on:
      - mcp-sql

  mcp-sql-web:
    image: malexple/mcp-sql-web:${MCPSQL_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      SITE_SERVICE_URL: http://mcp-sql:8080
    expose:
      - "8080"
    depends_on:
      - mcp-sql

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MCPSQL_DOMAIN=${MCPSQL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp-sql

volumes:
  mcp-data:
  caddy-data:
  caddy-config: