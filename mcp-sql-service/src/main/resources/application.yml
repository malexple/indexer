spring:
  application:
    name: mcp-sql-service
  ai:
    mcp:
      server:
        name: mcp-sql-service
        version: 0.1.0
        type: SYNC
        protocol: STATELESS
        instructions: >
          Code index of Java projects. Start with index_info, find a type with find_type,
          get an overview with context, then read_source. Use sql only for questions the other tools cannot answer.

server:
  port: 8080

mcpsql:
  data-dir: ${MCPSQL_DATA_DIR:./data}
  read-key: ${MCPSQL_READ_KEY:}
  write-key: ${MCPSQL_WRITE_KEY:}
  max-response-chars: 8000
  sql-timeout-seconds: 3
  sql-max-rows: 200
  max-upload-mb: 200
  multi:
    enabled: ${MCPSQL_MULTI_ENABLED:false}
    internal-key: ${MCPSQL_INTERNAL_KEY:}
    max-active-users: ${MCPSQL_MAX_ACTIVE_USERS:50}
    key-issues-per-day: ${MCPSQL_KEY_ISSUES_PER_DAY:5}
    max-workspaces: ${MCPSQL_MAX_WORKSPACES:3}
    max-db-mb: ${MCPSQL_MAX_DB_MB:20}
    uploads-per-day: ${MCPSQL_UPLOADS_PER_DAY:10}
    write-mb-per-day: ${MCPSQL_WRITE_MB_PER_DAY:300}
    patch-interval-seconds: ${MCPSQL_PATCH_INTERVAL_SECONDS:30}
    requests-per-day: ${MCPSQL_REQUESTS_PER_DAY:5000}
    min-free-disk-mb: ${MCPSQL_MIN_FREE_DISK_MB:2048}
    max-patch-sql-mb: ${MCPSQL_MAX_PATCH_SQL_MB:32}
