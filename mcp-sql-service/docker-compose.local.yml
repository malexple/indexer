services:
  mcp-sql:
    build:
      context: .
      dockerfile: Dockerfile
    image: malexple/mcp-sql:local
    ports:
      - "127.0.0.1:8080:8080"

  mcp-sql-bot:
    build:
      context: ../mcp-sql-bot
      dockerfile: Dockerfile
    image: malexple/mcp-sql-bot:local

  mcp-sql-web:
    build:
      context: ../mcp-sql-web
      dockerfile: Dockerfile
    image: malexple/mcp-sql-web:local
    ports:
      - "127.0.0.1:8081:8080"
